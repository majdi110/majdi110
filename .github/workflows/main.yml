name: Deploy ai2 to VPS
on: { push: { branches: [ main ] } }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with: { ssh-private-key: ${{ secrets.VPS_SSH_KEY }} }
      - run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_DIR:  /home/genweb/public_html/datav.belocloud.com/ai2
        run: |
          ssh ${VPS_USER}@${VPS_HOST} '
            set -euo pipefail
            cd '"$APP_DIR"'
            git fetch --depth=1 origin main
            git reset --hard origin/main
            if [ -s "$HOME/.nvm/nvm.sh" ]; then . "$HOME/.nvm/nvm.sh"; nvm use 16.20.2 || nvm install 16.20.2; fi
            [ -f package-lock.json ] && npm ci || npm install
            git -C '"$APP_DIR"'/.. rev-parse HEAD > VERSION.txt
            mkdir -p tmp && touch tmp/restart.txt
          '
      - name: Health check
        run: |
          curl -fsS https://datav.belocloud.com/ai2/_health >/dev/null
          curl -fsS https://datav.belocloud.com/ai2/health  >/dev/null
